<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE ASCENT — 신입사원 박재원 (모바일)</title>
<style>
  :root{
    --bg:#0a0e1a; --ui:#0d1220; --line:#f2f0f7; --accent:#f37321; --gold:#ffd24a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    font-family:"DungGeunMo","Galmuri11","NeoDunggeunmo","맑은 고딕","Malgun Gothic",monospace;
    color:var(--line);
  }
  #stage{
    width:min(96vw, calc(96vh * 9 / 16));
    aspect-ratio:9/16;
    border:4px solid var(--line);
    box-shadow:0 0 0 4px var(--bg), 0 0 0 6px var(--accent);
    image-rendering:pixelated;
    cursor:pointer;
    background:#000;
  }
  #hud{display:flex;gap:10px;align-items:center;font-size:13px;opacity:.85}
  button{
    font:inherit;color:var(--line);background:var(--ui);
    border:2px solid var(--line);padding:6px 14px;cursor:pointer
  }
  button:hover{background:var(--accent);border-color:var(--accent);color:#000}
  button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  @media (prefers-reduced-motion: reduce){ #hint{display:none} }
</style>
</head>
<body>
<canvas id="stage" width="720" height="1280" aria-label="박재원 자기소개 애니메이션"></canvas>
<div id="hud">
  <button id="btnReplay">▶ 처음부터</button>
  <button id="btnNext">⏭ 다음 장면</button>
  <span id="hint">클릭/스페이스 = 다음 장면 · 녹화는 Win+G</span>
</div>

const portraitImg=new Image(); portraitImg.src=CONFIG.portrait;
const hobbyImgs=CONFIG.hobbies.map(hb=>{const i=new Image(); i.src=hb.src; return i;});
const cv = document.getElementById("stage");
const cx = cv.getContext("2d");
const W = cv.width, H = cv.height, P = 4; // P = 픽셀 단위

const FONT = '"DungGeunMo","Galmuri11","맑은 고딕","Malgun Gothic",monospace';
const f=(s,w)=> `${w||""} ${Math.round(s*1.1)}px ${FONT}`;

// ---------- 유틸 ----------
const px = (x,y,w,h,c)=>{ cx.fillStyle=c; cx.fillRect(Math.round(x/P)*P, Math.round(y/P)*P, Math.ceil(w/P)*P, Math.ceil(h/P)*P); };
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function text(s,x,y,size,c,align="left",weight=""){ cx.font=f(size,weight); cx.fillStyle=c; cx.textAlign=align; cx.textBaseline="top"; cx.fillText(s,x,y); }
function typewriter(s,t,cps=22){ return s.slice(0, Math.floor(t*cps)); }
function box(x,y,w,h){ px(x-6,y-6,w+12,h+12,"#f2f0f7"); px(x-2,y-2,w+4,h+4,"#0d1220"); }

// ---------- 별/배경 ----------
const stars=[...Array(90)].map((_,i)=>({x:(i*97)%W, y:(i*53)%(H*0.7), s:(i%3)+1}));
function sky(top,bot){ const g=cx.createLinearGradient(0,0,0,H); g.addColorStop(0,top); g.addColorStop(1,bot); cx.fillStyle=g; cx.fillRect(0,0,W,H); }
function drawStars(t,alpha=1){ stars.forEach((s,i)=>{ const tw=(Math.sin(t*2+i)+1)/2; cx.globalAlpha=alpha*(0.3+0.7*tw); px(s.x,s.y,s.s*P/2+2,s.s*P/2+2,"#f2f0f7"); }); cx.globalAlpha=1; }

// 산 실루엣 (계단식 픽셀)
function mountain(baseY, peakX, peakY, half, rock, snowLine){
  const step=P*3;
  for(let x=peakX-half;x<=peakX+half;x+=step){
    const d=Math.abs(x-peakX)/half;
    const yTop=peakY+(baseY-peakY)*d + Math.sin(x*0.05)*6;
    px(x,yTop,step,baseY-yTop,rock);
    if(snowLine!=null && yTop<snowLine) px(x,yTop,step,Math.min(snowLine-yTop, baseY-yTop),"#f2f0f7");
  }
}

// ---------- 캐릭터 스프라이트 ----------
// 0:없음 1:피부 2:자켓(주황) 3:바지 4:부츠 5:배낭 6:모자
const PAL={1:"#e8b48a",2:"#f37321",3:"#26324f",4:"#3a2c22",5:"#3f6b4f",6:"#26324f"};
const BODY=[
"..6666......",
"..6666......",
"..1111......",
"..1111......",
"5522222.....",
"5522222.....",
"5522222.....",
"552222221...",
"..2222......",
"..3333......",
"..3333......",
];
const LEG_A=["..33.33.....","..33.33.....","..44.44....."];
const LEG_B=["..33..33....","..33..33....","..44..44...."];
function sprite(x,y,scale,frame){
  const rows=BODY.concat(frame?LEG_A:LEG_B);
  rows.forEach((r,ry)=>{ [...r].forEach((c,rx)=>{ if(PAL[c]) { cx.fillStyle=PAL[c]; cx.fillRect(x+rx*scale, y+ry*scale, scale, scale); } }); });
}

// ---------- 씬 관리 ----------
let sceneIdx=0, sceneStart=performance.now(), last=performance.now();
const scenes=[];
function addScene(dur,draw){ scenes.push({dur,draw}); }
function nextScene(){ sceneIdx=Math.min(sceneIdx+1,scenes.length-1); sceneStart=performance.now(); }
function replay(){ sceneIdx=0; sceneStart=performance.now(); }

/* ========== 공용: cover 드로잉 ========== */
function cover(img,dx,dy,dw,dh){
  if(!(img.complete&&img.naturalWidth)) return;
  const sr=img.naturalWidth/img.naturalHeight, tr=dw/dh;
  let sx=0,sy=0,sw=img.naturalWidth,sh=img.naturalHeight;
  if(sr>tr){ sw=sh*tr; sx=(img.naturalWidth-sw)/2; } else { sh=sw/tr; sy=(img.naturalHeight-sh)/2; }
  cx.drawImage(img,sx,sy,sw,sh,dx,dy,dw,dh);
}

/* ========== S0. 타이틀 ========== */
addScene(5.5,(t)=>{
  sky("#0a0e1a","#1a2340");
  drawStars(t);
  mountain(H*1.02, W*0.5, H*0.58, W*0.75, "#26324f", H*0.66);
  const a=clamp(t/1,0,1);
  const sh2=(s,x,y,size,c,w)=>{ cx.globalAlpha=a; text(s,x+3,y+3,size,"rgba(0,0,0,.65)","center",w); text(s,x,y,size,c,"center",w); cx.globalAlpha=1; };
  sh2(CONFIG.title1, W/2, H*0.095, 26, "#ffd24a");
  sh2("THE ASCENT", W/2, H*0.15, 58, "#f2f0f7","bold");
  sh2(CONFIG.title2, W/2, H*0.245, 26, "#f2f0f7");

/* ========== S1. 캐릭터 선택 ========== */
addScene(11,(t)=>{
  sky("#101830","#233054");
  drawStars(t,0.5);
  text("CHARACTER SELECT", W/2, 30, 28, "#ffd24a","center","bold");

  // 증명사진 + 미니 아바타
  const bw0=210, bh0=262, bx0=(W-bw0)/2, by0=86;
  box(bx0, by0, bw0, bh0);
  if(portraitImg.complete && portraitImg.naturalWidth){
    const ph2=bh0, pw2=portraitImg.naturalWidth*ph2/portraitImg.naturalHeight;
    cx.drawImage(portraitImg, bx0+(bw0-pw2)/2, by0, pw2, ph2);
  }
  sprite(bx0+bw0-54, by0+bh0-62, 4, Math.floor(t*4)%2);
  text(CONFIG.name, W/2, 364, 36, "#f2f0f7","center","bold");
  text(`${CONFIG.team} · 신입 · 2002년생`, W/2, 414, 24, "#f37321","center","bold");
  text("한양대학교 도시공학과", W/2, 450, 21, "#8fa0c8","center");

  // 스탯
  const bx=40, by=488, bw=W-80;
  box(bx,by,bw,264);
  text("STATUS", bx+22, by+14, 20, "#ffd24a");
  CONFIG.stats.forEach((st,i)=>{
    const show=clamp((t-0.8-i*0.55)/0.5,0,1);
    const y=by+54+i*52;
    text(st.label, bx+22, y, 19, "#f2f0f7");
    px(bx+170, y+2, bw-200, 18, "#26324f");
    px(bx+170, y+2, (bw-200)*(st.v/10)*ease(show), 18, "#f37321");
  });

  const tagShow=clamp((t-3.2)/0.5,0,1);
  cx.globalAlpha=tagShow;
  text("TAGS  "+CONFIG.tags.join(" · "), bx+22, by+264+18, 19, "#8fd0ff","left","bold");
  text(CONFIG.tagline, W/2, by+264+50, 21, "#ffd24a","center","bold");
  cx.globalAlpha=1;

  // 취미 사진 3장
  CONFIG.hobbies.forEach((hb,i)=>{
    const show=clamp((t-3.8-i*0.7)/0.5,0,1);
    if(show<=0) return;
    cx.globalAlpha=show;
    const pw=213, ph=236, hx=20+i*233, hy=846;
    box(hx,hy,pw,ph);
    cover(hobbyImgs[i], hx, hy, pw, ph);
    px(hx, hy+ph-30, pw, 30, "#0d1220");
    text(hb.cap, hx+pw/2, hy+ph-25, 14, "#f2f0f7","center","bold");
    cx.globalAlpha=1;
  });
});

/* ========== S2. 등반 (시그니처 씬) ========== */
const ALT0=1000, ALT1=5895;
addScene(17,(t)=>{
  const pr=clamp(t/15,0,1);
  const top=lerpColor("#1a2340","#7db8e8",pr), bot=lerpColor("#3a2c55","#dceaf5",pr);
  sky(top,bot);
  drawStars(t,1-pr);

  const baseY=H*0.94, peakY=H*0.13;
  mountain(baseY, W*0.82, peakY, W*1.05, "#4a3f55", peakY+H*0.11);
  cx.setLineDash([10,14]); cx.strokeStyle="rgba(242,240,247,.5)"; cx.lineWidth=4;
  cx.beginPath(); cx.moveTo(W*0.05, baseY-20); cx.lineTo(W*0.76, peakY+40); cx.stroke(); cx.setLineDash([]);

  const chx=W*0.05 + (W*0.71)*ease(pr), chy=(baseY-40) + (peakY+40-(baseY-40))*ease(pr);
  sprite(chx, chy-14*8, 8, Math.floor(t*6)%2);

  // 고도계
  const alt=Math.round(ALT0+(ALT1-ALT0)*ease(pr));
  box(28, 34, 400, 72);
  text("ALTITUDE", 50, 44, 17, "#ffd24a");
  if(pr>=1) text("Global No.1 RWA Hub", 50, 70, 26, "#f2f0f7","left","bold");
  else if(pr>=0.52 && pr<0.70) text("종투사 진입", 50, 68, 28, "#ffd24a","left","bold");
  else text(alt.toLocaleString()+" m", 50, 68, 28, "#f2f0f7","left","bold");

  // 목표 획득 팝업 (하나씩)
  CONFIG.goals.forEach((g,i)=>{
    const at=1.4+i*2.4, dt2=t-at;
    if(dt2>0&&dt2<2.2){
      const a=dt2<0.3?dt2/0.3:(dt2>1.8?(2.2-dt2)/0.4:1);
      cx.globalAlpha=a;
      const y=H*0.26+((i%2)*58);
      box(28, y, 470, 44);
      text("★ "+g+" 획득!", 44, y+10, 20, "#ffd24a");
      cx.globalAlpha=1;
    }
  });

  // 핵심가치 뱃지
  CONFIG.values.forEach((v,i)=>{
    const at=13.2+i*0.5, got=t>at;
    const x=28+i*150, y=H*0.74;
    px(x,y,132,46, got?"#f37321":"#26324f");
    text(v, x+66, y+10, 22, got?"#000":"#5a6a8f","center","bold");
  });
  text("핵심가치 획득", 28, H*0.74-32, 16, "rgba(242,240,247,.85)");
});

});

let photoImg=null;
if(CONFIG.photo){ photoImg=new Image(); photoImg.src=CONFIG.photo; }
addScene(999,(t)=>{
  sky("#0a0e1a","#101830");
  drawStars(t,0.6);
  const pw=320, ph=320, pxx=(W-pw)/2, pyy=H*0.10;
  box(pxx,pyy,pw,ph);
  if(photoImg && photoImg.complete && photoImg.naturalWidth){
    cover(photoImg, pxx, pyy, pw, ph);
  }
  CONFIG.creditLines.forEach((l,i)=>{
    const show=clamp((t-0.4-i*0.5)/0.5,0,1);
    cx.globalAlpha=show;
    text(l, W/2, pyy+ph+56+i*50, l.startsWith("PLAYER")||l.startsWith("THANKS")?28:22, l.includes("핵심가치")||l.includes("최종 목표")?"#f37321":"#f2f0f7","center", l.startsWith("THANKS")?"bold":"");
    cx.globalAlpha=1;
  });
  if(Math.floor(t*2)%2===0) text("R 또는 ▶ 버튼으로 다시 보기", W/2, H*0.94, 15, "#8fa0c8","center");
});

// ---------- 헬퍼 ----------
function lerpColor(a,b,t){
  const pa=[1,3,5].map(i=>parseInt(a.substr(i,2),16)), pb=[1,3,5].map(i=>parseInt(b.substr(i,2),16));
  return "rgb("+pa.map((v,i)=>Math.round(v+(pb[i]-v)*t)).join(",")+")";
}
function quad(a,b,c,t){ return (1-t)*(1-t)*a + 2*(1-t)*t*b + t*t*c; }
function wrapText(s,x,y,maxW,size,color,maxChars){
  cx.font=f(size); cx.fillStyle=color; cx.textAlign="left"; cx.textBaseline="top";
  let line="", yy=y;
  for(const ch of s){
    if(cx.measureText(line+ch).width>maxW || line.length>=maxChars){ cx.fillText(line,x,yy); yy+=size+8; line=ch; }
    else line+=ch;
  }
  cx.fillText(line,x,yy);
}

// ---------- 루프 ----------
function frame(now){
  const t=(now-sceneStart)/1000;
  const sc=scenes[sceneIdx];
  cx.clearRect(0,0,W,H);
  sc.draw(t);
  // 진행 바
  const total=scenes.slice(0,-1).reduce((a,s)=>a+s.dur,0);
  const done=scenes.slice(0,sceneIdx).reduce((a,s)=>a+s.dur,0)+Math.min(t,sc.dur);
  px(0,H-6,W*clamp(done/total,0,1),6,"#f37321");
  if(t>=sc.dur && sceneIdx<scenes.length-1) nextScene();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- 입력 ----------
cv.addEventListener("click", nextScene);
document.getElementById("btnNext").addEventListener("click", nextScene);
document.getElementById("btnReplay").addEventListener("click", replay);
addEventListener("keydown",e=>{
  if(e.code==="Space"){ e.preventDefault(); nextScene(); }
  if(e.key==="r"||e.key==="R") replay();
});
</script>
